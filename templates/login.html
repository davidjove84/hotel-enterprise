<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Hotel Libertadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #182338;
            --card-bg-soft: #1e293b;
            --border-subtle: #2b3b57;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80') no-repeat center center;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        h1, .brand-title {
            font-family: 'Playfair Display', serif;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.6);
        }

        .text-gold { color: var(--accent-gold) !important; }

        .form-control {
            background-color: var(--card-bg-soft) !important;
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
        }

        .form-control:focus {
            border-color: var(--accent-gold) !important;
            box-shadow: 0 0 0 0.2rem rgba(251, 191, 36, 0.15) !important;
            background-color: var(--card-bg-soft) !important;
            color: var(--text-main);
        }

        .btn-gold {
            background-color: var(--accent-gold);
            color: #0f172a;
            font-weight: 600;
            border: none;
        }

        .btn-gold:hover {
            background-color: #f59e0b;
            color: #0f172a;
        }
    </style>
</head>
<body data-bs-theme="dark">

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast show align-items-center text-white bg-{% if category == 'success' %}success{% elif category == 'warning' %}warning text-dark{% else %}primary{% endif %} border-0 shadow-lg mb-2" role="alert">
                        <div class="d-flex">
                            <div class="toast-body fw-semibold">{{ message }}</div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="login-card">
        <div class="text-center mb-4">
            <h1 class="brand-title text-gold fs-2 mb-1">HOTEL LIBERTADORES 🏨</h1>
            <p class="text-muted small mb-0">Acceso para personal autorizado</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="tu@hotellibertadores.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-gold w-100 py-2 fw-bold">Iniciar Sesión</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
