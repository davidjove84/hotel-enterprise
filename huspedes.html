<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Libertadores - Historial de Huéspedes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🏨 Hotel Libertadores</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('ver_habitaciones') }}">Habitaciones</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('huespedes') }}">Huéspedes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h1 class="h3 fw-bold mb-4">Historial de Huéspedes Registrados</h1>
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#ID</th>
                            <th>Nombre del Huésped</th>
                            <th>Documento (DNI/Pasaporte)</th>
                            <th>Habitación Asignada</th>
                            <th>Noches</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for h in huespedes %}
                        <tr>
                            <td>{{ h.id }}</td>
                            <td><strong>{{ h.nombre }}</strong></td>
                            <td>{{ h.documento }}</td>
                            <td><span class="badge bg-primary">N° {{ h.habitacion }}</span></td>
                            <td>{{ h.noches }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
